services:
  python-app:
    container_name: python-container
    image: ancharitos/annotationtooldockercontainers-python-app:latest

  java-app:
    restart: on-failure
    container_name: java-container
    image: ancharitos/annotationtooldockercontainers-java-app:latest
    depends_on:
      - python-app
    environment:
      - FASTAPI_URL=http://python-app:8000/
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"